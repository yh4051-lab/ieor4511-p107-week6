name: Actual historical price access pilot

on:
  push:
    branches: [actual-history-pilot-2026-11]
  workflow_dispatch:

jobs:
  historical-price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned historical price dependency
        run: python -m pip install -r requirements-stock.txt
      - name: Fetch genuine AAPL + SPY 2020-2021 observations
        run: |
          python - <<'PY'
          from p107.market_data import load_history
          data=load_history(['AAPL','SPY'],'2020-01-02','2021-12-31')
          assert len(data['dates'])>400
          assert all(x>0 for x in data['prices']['AAPL'])
          print('REAL_MARKET_DATA_SUCCESS')
          print('OBSERVATIONS',len(data['dates']))
          print('DATES',data['dates'][0],data['dates'][-1])
          print('SHA256',data['metadata']['data_sha256'])
          print('SOURCE',data['metadata']['source'])
          PY
