name: Verify Dom feedback research extensions

on:
  push:
    branches: [dom-feedback-2026-11-10]
  pull_request:
    branches: [main]

jobs:
  research-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and all tests
        run: python -m compileall -q p107 tests tools
      - name: Unit/regression tests (no external prices)
        run: python -m unittest discover -s tests -v
